name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Verify project structure
        shell: bash
        run: |
          set -e
          test -f flutter_app/pubspec.yaml || { echo "::error::flutter_app/pubspec.yaml not found"; exit 1; }
          test -d flutter_app/android || { echo "::error::flutter_app/android not found. Commit the android/ folder."; exit 1; }
          test -f flutter_app/android/app/build.gradle* || { echo "::error::app build.gradle(.kts) not found"; exit 1; }
          test -f flutter_app/android/app/src/main/AndroidManifest.xml || { echo "::error::AndroidManifest.xml not found"; exit 1; }
          echo "Project structure OK."

      - name: Resolve dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Verify pubspec assets exist
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, sys
          import re

          text = pathlib.Path("flutter_app/pubspec.yaml").read_text(encoding="utf-8")
          missing = []
          in_assets = False
          for line in text.splitlines():
              stripped = line.strip()
              if re.match(r"^\s{2}assets:\s*$", line):
                  in_assets = True
                  continue
              if in_assets:
                  m = re.match(r"^\s{4}-\s*(\S+)\s*$", line)
                  if m:
                      p = pathlib.Path("flutter_app") / m.group(1)
                      if p.suffix == "" or str(m.group(1)).endswith("/"):
                          if not p.is_dir():
                              missing.append(str(p))
                      elif not p.exists():
                          missing.append(str(p))
                  elif stripped and not line.startswith("     "):
                      in_assets = False
          if missing:
              for m in missing:
                  print(f"::error::Asset listed in pubspec.yaml not found: {m}")
              sys.exit(1)
          print("All pubspec assets exist.")
          PY

      - name: Verify Android configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          PKG = "com.mizan.app"
          app = pathlib.Path("flutter_app/android/app")
          errors = []

          gradle = next((p for p in (app / "build.gradle", app / "build.gradle.kts") if p.exists()), None)
          if gradle is None:
              errors.append("app build.gradle(.kts) missing")
          else:
              text = gradle.read_text(encoding="utf-8")
              if not re.search(rf'namespace\s*=?\s*"{re.escape(PKG)}"', text):
                  errors.append(f'namespace is not "{PKG}" in {gradle}')
              if not re.search(rf'applicationId\s*=?\s*"{re.escape(PKG)}"', text):
                  errors.append(f'applicationId is not "{PKG}" in {gradle}')
              m = re.search(r'compileSdk\s*=?\s*(\d+)', text)
              if not m or int(m.group(1)) < 35:
                  errors.append(f"compileSdk must be 35 or higher in {gradle}")

          manifest = app / "src/main/AndroidManifest.xml"
          if manifest.exists():
              tags = [t for t in re.findall(r"<meta-data\b[^>]*>", manifest.read_text(encoding="utf-8"))
                      if "flutterEmbedding" in t]
              if not any('android:value="2"' in t for t in tags):
                  errors.append("flutterEmbedding is not 2 in AndroidManifest.xml")

          for f in (app / "src/main").rglob("*"):
              if f.suffix in (".kt", ".java"):
                  if "io.flutter.app.FlutterActivity" in f.read_text(encoding="utf-8", errors="ignore"):
                      errors.append(f"{f} uses deprecated io.flutter.app.FlutterActivity")

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print("Android configuration verified.")
          PY

      - name: Static analysis
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos

      - name: Run tests if present
        working-directory: flutter_app
        shell: bash
        run: |
          if [ -d test ] && [ -n "$(ls -A test 2>/dev/null)" ]; then
            flutter test
          else
            echo "No tests found. Skipping."
          fi

      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
