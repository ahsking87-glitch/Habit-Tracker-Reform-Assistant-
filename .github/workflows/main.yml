name: Build and Release Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web project
        run: npm run build

  android-apk:
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web project
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HabitTracker-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-android
          path: HabitTracker-android.apk
          if-no-files-found: error

  ios-ipa:
    runs-on: macos-latest
    needs: web-build
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web project
        run: npm run build

      - name: Add iOS platform if missing
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build unsigned iOS archive
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        working-directory: ios/App/build
        run: |
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r HabitTracker-ios-unsigned.ipa Payload
          mv HabitTracker-ios-unsigned.ipa "$GITHUB_WORKSPACE/"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-ios-unsigned
          path: HabitTracker-ios-unsigned.ipa
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [android-apk, ios-ipa]
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: HabitTracker-android

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: HabitTracker-ios-unsigned

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" \
            HabitTracker-android.apk \
            HabitTracker-ios-unsigned.ipa \
            --repo "${{ github.repository }}" \
            --title "Habit Tracker $TAG" \
            --notes "Automatic build from commit ${{ github.sha }}. Android: install the APK directly. iOS: unsigned IPA, needs re-signing with AltStore or Sideloadly."
